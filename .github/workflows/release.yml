name: Personal release

on:
  push:
    branches: ["personal/**"]
    tags: ["v*-personal.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color .github/workflows/release.yml
      - run: npm install -g npm@11.8.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci --prefix testing/fake-llm-server --no-audit --no-fund
      - name: Verify version, release ownership and publishing regression tests
        run: |
          node --test scripts/personal-release.test.mjs
          node scripts/personal-release.mjs check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Formatting, lint and types
        run: |
          npm run fmt
          git diff > formatting.patch
          npm run lint
          npm run ts
      - name: Test local capabilities and existing model routing
        run: >-
          npm test --
          src/lib/personal_mode.test.ts
          src/lib/auxiliaryModel.test.ts
          src/shared/shell_capability.test.ts
          src/main/settings.test.ts
          src/ipc/utils/get_model_client.test.ts
          src/ipc/services/subscription_turn_preflight.test.ts
          src/pro/main/ipc/handlers/local_agent/tool_safety_reviewer.test.ts
          src/pro/main/ipc/handlers/local_agent/tools/run_shell.spec.ts
          src/pro/main/ipc/handlers/local_agent/tools/shell_process.test.ts
          src/pro/main/ipc/handlers/local_agent/tools/shell_process_windows.test.ts
          src/pro/main/ipc/handlers/local_agent/tools/subagent_tool_set.spec.ts
          src/pro/main/ipc/handlers/local_agent/tools/engine_fetch.test.ts
          src/pro/main/ipc/handlers/local_agent/mcp_auto_consent.spec.ts
      - name: Save formatter patch if needed
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore

  build:
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: macos-26-intel
            platform: darwin
            arch: x64
          - runner: macos-latest
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Linux packaging tools and C++20 compiler
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor /tmp/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-snapshot.gpg.key.gpg /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/llvm-toolchain-jammy-18.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y clang-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - run: npm install -g npm@11.8.0
      - run: npm ci --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile and make installers (unsigned personal distribution)
        run: npm run make -- --arch=${{ matrix.arch }}
      - name: Package startup smoke test
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/personal-smoke.mjs
      - name: Stage versioned assets and SHA256 manifests
        run: node scripts/personal-release.mjs stage
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: personal-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/personal-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: personal-*
          path: out/personal-artifacts/
          merge-multiple: true
      - name: Upload, verify every checksum and publish once
        run: node scripts/personal-release.mjs publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
